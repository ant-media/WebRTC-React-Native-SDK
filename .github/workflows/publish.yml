name: "publish"

on:
   push:
     branches: [ main ]

permissions:
   contents: read
   id-token: write

jobs:
  publish:
     name: publishing
     runs-on: ubuntu-latest

     steps:
        - name: checkout
          uses: actions/checkout@v6
        - name: installation of node
          uses: actions/setup-node@v6
          with:
            node-version: 24
            registry-url: 'https://registry.npmjs.org'
            package-manager-cache: false

        - name: install dependencies
          run: npm ci

        - name: verify trusted publishing environment
          run: |
           node --version
           npm --version
           test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
           test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
           npm pkg get name version repository

        - name: publish
          run: npm publish --access public
